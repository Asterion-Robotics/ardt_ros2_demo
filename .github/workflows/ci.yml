# The demo's CI is deliberately thin: it installs ardt and calls two pipelines.
# Everything else — the rosdep/colcon/sphinx/doxygen commands, the container
# recipes, the site layout — lives in ardt, versioned with the `ardt:` pin in
# ardt.yaml. That is the point of the repo: a robotics CI that is four steps of
# YAML, and the same commands a developer runs locally.
name: ci

on:
  push:
    branches: [main]
    # Required, not optional: once `branches:` is set, tag pushes stop
    # triggering this workflow unless `tags:` is set too. Publishing hangs off
    # these, so a missing line here is a silently dead release.
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # One place to move the toolchain. Keep it equal to `ardt.version` in
  # ardt.yaml: this pin is the ardt that *drives* the pipelines, that one is the
  # ardt installed *inside* the containers they build. Drift between them means
  # CI orchestrates one version and runs another.
  ARDT_REF: main
  # Read straight out of the environment by install.sh. `ardt-dev` is in its
  # default set but belongs on a workstation, not a runner; the doc modules are
  # not in it and docs-ci needs them, so the list is spelled out.
  ARDT_MODULES: >-
    ardt-core ardt-pipelines
    ardt-ros-tasks ardt-ros-pipelines
    ardt-doc-tasks ardt-doc-pipelines

jobs:
  # `ros-ci` is deps + build + test as stages of an image build: a red test is a
  # failed `docker build`. No colcon here, no ROS on the runner — Dagger drives
  # the whole thing over the runner's docker socket.
  ros-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # the test reporter publishes a check run
      pull-requests: write # ...and a summary comment on the PR
      packages: write # tag runs push the runtime image to ghcr.io
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The same one-liner the README gives a developer, ARDT_REF/ARDT_MODULES
      # from the env above. PATH is set before the script runs, not after: it
      # ends with its own `command -v ardt` check and would fail the step.
      - name: Install ardt
        run: |
          uv tool dir --bin >> "$GITHUB_PATH"
          export PATH="$(uv tool dir --bin):$PATH"
          curl -LsSf https://raw.githubusercontent.com/Asterion-Robotics/ardt/main/install.sh | bash

      # `--publish` on tag runs only: ghcr.io/<owner>/<repo>:<version>, with
      # ardt reading GITHUB_TOKEN for the registry login (the ci.py
      # normalization). Branch and PR runs still build the runtime image (a
      # broken runtime stage fails the run) and drop it — off-tag versions
      # (1.2.3.dev4+g<sha>) are not valid image tags anyway, by design.
      - name: Build, test and package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ardt pipe run ros-ci ${{ startsWith(github.ref, 'refs/tags/v') && '--publish' || '' }}

      # The pipeline exports the JUnit XMLs here whether the run is green or
      # red; `if: always()` is what makes a failure inspectable.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-reports
          path: pipeline-reports/
          if-no-files-found: ignore

      # Turns those XMLs into a check run and a PR comment, so a red test is
      # readable without downloading the artifact. `always()` again: tests are
      # RUN layers, so a failure fails the step above — which is exactly when
      # the report is worth having.
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: pipeline-reports/**/*.xml
          # A run that finds no XML at all means the pipeline's staging step
          # regressed, not that the workspace has no tests. Fail loudly rather
          # than report "0 tests" in green.
          action_fail_on_inconclusive: true

  # `docs-ci` builds the working tree plus every `v*` tag into public/, each with
  # its own docs and its own conf.py, and writes the versions.json the theme's
  # flyout reads. `tasks.doc.strict` defaults to true, so a sphinx warning in any
  # version fails the job.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Mandatory here, not just nice-to-have: historical versions are built
          # by cloning this checkout and checking out each tag, so the objects
          # and tags have to be present locally.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install ardt
        run: |
          uv tool dir --bin >> "$GITHUB_PATH"
          export PATH="$(uv tool dir --bin):$PATH"
          curl -LsSf https://raw.githubusercontent.com/Asterion-Robotics/ardt/main/install.sh | bash

      - name: Build the versioned site
        run: ardt pipe run docs-ci

      # Not plain upload-artifact: deploy-pages only consumes the `github-pages`
      # tarball this action produces. Uploaded on every event, so a pull request
      # gets a downloadable site to review; only tags go on to deploy it.
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  # Publishing is tag-only: main and pull requests build the site and stop.
  deploy-docs:
    needs: docs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write # create the deployment
      id-token: write # deploy-pages authenticates over OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deliberately not the workflow-level `cancel-in-progress: true` group: a
    # half-cancelled deployment is worse than a queued one.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

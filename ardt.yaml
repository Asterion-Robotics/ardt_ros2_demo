# ardt.yaml — the whole repo's tooling config (see ardt's ardt.example.yaml).

project:
  name: ardt_ros2_demo

# The ONE ardt pin, read by both planes: install.sh defaults to this ref when
# run from the repo root (so CI installs the driving ardt at it, no parsing of
# its own), and the pipelines install the same ref inside the containers they
# build. The recipe/task contract (e.g. the /ws workspace layout) only holds
# when the two match — pinning v0.0.3 while the driving ardt rendered v0.1.x
# recipes is exactly how it breaks. CI overrides it with
# `--arg ardt_source=…` when it wants a specific checkout instead.
ardt:
  # the commit that will be v0.6.0 (the pipeline plane on docker buildx); moves
  # to the tag once it is cut
  version: 057b1c24b977e2145700bcf256adeeb765ae0e9f
  # install.sh's default bundle is contextual: core + pipelines + the ROS 2
  # plugins everywhere, plus the devcontainer ones (ardt-devcontainers,
  # ardt-ros-dev) off CI. The doc modules are not in it, and `docs-ci` needs
  # them, so this repo opts in. Declared here rather than as ARDT_MODULES in
  # the CI files: that variable *replaces* the bundle outright, which meant
  # spelling out the whole list twice and losing the devcontainer modules on a
  # workstation.
  install_extras: [ardt-doc-tasks, ardt-doc-pipelines]

tasks:
  ros:
    distro: jazzy
  doc:
    source_dir: ardt_ros2_demo/doc # docs live in the aggregator package

# ardt-doc-pipelines — `ardt pipe run docs-ci` builds the versioned site into public/.
pipelines:
  docs_ci:
    versions:
      tags: "v*" # every release tag becomes a version of the site
      # No `branches:` — historical branches are resolved with `git rev-parse`,
      # which does not see `origin/main` in a tag checkout, so a branch entry
      # would silently drop out of exactly the runs that publish. Tags only.

  # ardt-ros-pipelines — `ardt pipe run ros-ci` runs deps/build/test as image
  # stages. The demo never pushes an image, so only the build knobs are set.
  ros_ci:
    builder: ros:jazzy-ros-base
    base_image: ros:jazzy-ros-base
    install_base: /opt/ros/demo

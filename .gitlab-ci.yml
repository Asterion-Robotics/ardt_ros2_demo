# ardt_ros2_demo GitLab CI — a mirror of .github/workflows/ci.yml.
#
# Same deliberately-thin shape: install ardt, call two pipelines. The
# rosdep/colcon/sphinx/doxygen commands, the container recipes and the site
# layout live in ardt, pinned by `ardt.version` in ardt.yaml.
#
# The one real difference from the GitHub side: both pipelines drive
# containers through Dagger over a Docker daemon. GitHub runners have one on
# the VM for free; here it is the docker:dind service, which requires a
# privileged runner (the gitlab.com shared-runner default).

stages:
  - sync
  - build
  - deploy

# Branch pushes, MRs (deduplicated: an open MR suppresses the branch
# pipeline), v* tags, and schedules. Wider than the GitHub `branches: [main]`
# trigger on purpose — any branch push runs, which is what you want while
# shaking this file out on a real runner.
#
# Schedules exist for exactly one job: sync-github below. Note that schedules
# also set $CI_COMMIT_BRANCH, so the branch rule alone would admit them —
# which is why the build jobs carry an explicit schedule guard.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v/

variables:
  # ARDT_REF is deliberately NOT set: install.sh runs from the repo root and
  # defaults to the `ardt.version` pin in ardt.yaml, so the ardt that *drives*
  # the pipelines and the ardt installed *inside* the containers they build
  # cannot drift (the recipe/task contract, e.g. the /ws workspace layout,
  # only holds when the two match).
  # ARDT_MODULES is read straight out of the environment by install.sh. `ardt-dev` is in its
  # default set but belongs on a workstation, not a runner; the doc modules
  # are not in it and docs-ci needs them, so the list is spelled out.
  ARDT_MODULES: >-
    ardt-core ardt-pipelines
    ardt-ros-tasks ardt-ros-pipelines
    ardt-doc-tasks ardt-doc-pipelines
  # uv resolves this instead of a setup-uv step; it downloads a standalone
  # CPython (musl build on this alpine image) on first use.
  UV_PYTHON: "3.12"
  # The documented client<->dind TLS handshake: dind generates certs into a
  # volume both containers share. See
  # https://docs.gitlab.com/ci/docker/using_docker_build/
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "/certs/client"

# Shared by both pipeline jobs: docker client + dind daemon + uv + ardt.
# If uv's musl python ever misbehaves on the alpine cli image, the fallback
# is a debian python image plus a static docker client — note it here.
.ardt:
  image: docker:27-cli
  services:
    - docker:27-dind
  interruptible: true # the GitHub `cancel-in-progress` equivalent
  before_script:
    - apk add --no-cache bash curl git
    # PATH before install.sh, not after: the script ends with its own
    # `command -v ardt` check and would fail. uv and uv-installed tools both
    # land in ~/.local/bin.
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - curl -LsSf https://raw.githubusercontent.com/Asterion-Robotics/ardt/main/install.sh | bash

# `ros-ci` is deps + build + test as stages of an image build: a red test is
# a failed image build. No colcon here, no ROS on the runner — Dagger drives
# the whole thing against the dind daemon.
#
# `--publish` on tag pipelines only: the image lands at
# ${CI_REGISTRY}/${CI_PROJECT_PATH}:<version>, with ardt reading the job's
# CI_REGISTRY_USER/PASSWORD itself (the ci.py normalization — no docker login
# here). Branch and MR runs still build the runtime image (a broken runtime
# stage fails the run) and drop it — off-tag versions (1.2.3.dev4+g<sha>) are
# not valid image tags anyway, by design. The flag travels through a
# rules-variable, not `${CI_COMMIT_TAG:+…}` in the script line: see the
# base-images repo for the inline-bashism trap that avoids.
ros-ci:
  extends: .ardt
  stage: build
  variables:
    PUBLISH_FLAG: ""
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" # schedules are sync-github only
      when: never
    - if: $CI_COMMIT_TAG =~ /^v/
      variables:
        PUBLISH_FLAG: "--publish"
    - when: on_success # every other pipeline the workflow rules admit
  script:
    - ardt pipe run ros-ci $PUBLISH_FLAG
  # `when: always` is what makes a red run inspectable — tests are RUN
  # layers, so a failure fails the script, which is exactly when the XMLs
  # are worth having. The junit report is the native replacement for the
  # publish-unit-test-result action: MR Test widget + pipeline Tests tab.
  artifacts:
    when: always
    paths:
      - pipeline-reports/
    reports:
      junit: pipeline-reports/**/*.xml

# `docs-ci` builds the working tree plus every v* tag into public/, each with
# its own docs, and writes the versions.json the theme's flyout reads.
# `tasks.doc.strict` defaults to true, so a sphinx warning in any version
# fails the job. Runs on every pipeline; only the pages job below publishes.
docs:
  extends: .ardt
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" # schedules are sync-github only
      when: never
    - when: on_success # otherwise: every pipeline, same as no rules at all
  variables:
    # Full clone, mandatory here: historical versions are built by cloning
    # this checkout and checking out each tag, so the objects and tags have
    # to be present locally (the runner's default shallow fetch drops both).
    GIT_DEPTH: "0"
    GIT_FETCH_EXTRA_FLAGS: --prune --tags
  script:
    - ardt pipe run docs-ci
  artifacts:
    paths:
      - public

# Publishing is tag-only: branches and MRs build the site (downloadable from
# the docs job's artifact) and stop. The magic job name `pages` is what
# triggers the GitLab Pages deploy of the public/ artifact — the whole
# OIDC/deploy-pages dance on the GitHub side collapses into this.
pages:
  stage: deploy
  image: alpine:3.20
  needs:
    - docs
  script:
    - echo "publishing public/ from the docs job"
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

# Poor-man's pull mirroring (the built-in one is a Premium feature): a
# scheduled pipeline clones the GitHub source of truth and pushes every
# branch and tag into this project. Runs alone; every other job carries a
# schedule guard. GitHub is public, so the clone needs no credentials.
#
# SYNC_TOKEN is a project access token (Maintainer role, write_repository
# scope) stored as a masked+protected CI variable. Because the push uses a
# real token (not the job's CI_JOB_TOKEN), a synced main/tag triggers a
# normal pipeline here, so GitLab CI and Pages follow GitHub automatically.
#
# The `+` refspecs force-update, and --prune deletes branches gone upstream:
# correct for a mirror, but it means this copy is read-only. Anything
# committed only on GitLab gets clobbered on the next tick. GitHub's hidden
# refs/pull/* refs are deliberately not synced.
sync-github:
  stage: sync
  # The bare image name does not work here: alpine/git sets ENTRYPOINT
  # ["git"], and the docker executor feeds the job script through the
  # entrypoint, turning it into `git sh -c ...`. Blanking it restores a
  # plain shell.
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none # no checkout of the GitLab copy; we clone GitHub
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - git clone --bare https://github.com/Asterion-Robotics/ardt_ros2_demo.git source
    - cd source
    - git push --prune "https://oauth2:${SYNC_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "+refs/heads/*:refs/heads/*" "+refs/tags/*:refs/tags/*"
